[project]
name = "annomemo"
version = "0.1.0"
description = "A service for automatically OCRing images attached to memos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.10.10",
    "alembic>=1.14.0",
    "click>=8.1.7",
    "fastapi>=0.115.4",
    "flask>=3.0.3",
    "litellm>=1.50.0",
    "loguru>=0.7.2",
    "pwdlib[argon2]>=0.2.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.17",
    "python-telegram-bot>=21.6",
    "requests>=2.32.3",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
vlm = [
    "qwen-vl-utils==0.0.8",
    "transformers>=4.46.1",
    "accelerate>=0.26.0",
    "auto_gptq==0.7.1"
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
annomemo = "annomemo:main"
